name: Build Tmusic 3.0

on:
  push:
    tags:
      - "v3.0"
      - "v3.0.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
            arch: x86_64
            python-arch: x64
          - platform: Linux
            runner: ubuntu-24.04-arm
            arch: arm64
            python-arch: arm64
          - platform: Windows
            runner: windows-2025
            arch: x86_64
            python-arch: x64
          - platform: Windows
            runner: windows-11-arm
            arch: arm64
            python-arch: arm64
          - platform: macOS
            runner: macos-15-intel
            arch: x86_64
            python-arch: x64
          - platform: macOS
            runner: macos-15
            arch: arm64
            python-arch: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch }}

      - name: Install Linux GUI and media dependencies
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gir1.2-ayatanaappindicator3-0.1 \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            patchelf \
            python3-dbus \
            python3-gi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/webui/package-lock.json

      - name: Build local web interface
        run: |
          npm ci --prefix src/webui
          npm run build --prefix src/webui

      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

      - name: Prepare release directory
        run: mkdir release

      - name: Install Inno Setup
        if: matrix.platform == 'Windows'
        run: choco install innosetup --yes --no-progress
        shell: pwsh

      - name: Install create-dmg (macOS)
        if: matrix.platform == 'macOS'
        run: brew install create-dmg

      - name: Build Linux AppImage with Nuitka
        if: matrix.platform == 'Linux'
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages:src
        run: |
          python -m nuitka \
            --mode=app-dist \
            --output-dir=build \
            --output-filename=Tmusic \
            --disable-plugin=pywebview \
            --include-data-dir=src/webui/dist=webui/dist \
            --include-data-files=Logo.jpeg=Logo.jpeg \
            --include-package=pystray \
            --include-package=webview \
            --include-module=webview.platforms.gtk \
            --include-module=platform_integration.MPRIS \
            --nofollow-import-to=platform_integration.SMTC \
            --nofollow-import-to=platform_integration.NowPlaying \
            --product-name=Tmusic \
            --company-name="Invaer Labs" \
            --product-version=3.0 \
            --linux-create-installer \
            --linux-installer-output=release/Tmusic-Linux-${{ matrix.arch }}.AppImage \
            --assume-yes-for-downloads \
            --jobs=2 \
            src/main.pyw

      - name: Build Windows installer with Nuitka and Inno Setup
        if: matrix.platform == 'Windows'
        env:
          PYTHONPATH: src
        shell: pwsh
        run: |
          python -m nuitka `
            --mode=app-dist `
            --output-dir=build `
            --output-folder-name=Tmusic.dist `
            --output-filename=Tmusic `
            --disable-plugin=pywebview `
            --windows-console-mode=disable `
            --include-data-dir=src/webui/dist=webui/dist `
            --include-data-files=Logo.jpeg=Logo.jpeg `
            --include-package=pystray `
            --include-package=webview `
            --include-module=webview.platforms.winforms `
            --include-module=platform_integration.SMTC `
            --include-package=winsdk `
            --nofollow-import-to=platform_integration.MPRIS `
            --nofollow-import-to=platform_integration.NowPlaying `
            --assume-yes-for-downloads `
            --jobs=2 `
            src/main.pyw

          if (-not (Test-Path "build\Tmusic.dist\Tmusic.exe")) {
            Get-ChildItem build -Force
            throw "Nuitka did not create build\Tmusic.dist\Tmusic.exe."
          }

          $innoSetup = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $innoSetup) {
            throw "Inno Setup compiler (ISCC.exe) was not found."
          }
          & $innoSetup "/DArch=${{ matrix.arch }}" installer.iss

      - name: Build macOS DMG with Nuitka
        if: matrix.platform == 'macOS'
        env:
          PYTHONPATH: src
        run: |
          python -m nuitka \
            --mode=app-dist \
            --output-dir=build \
            --output-filename=Tmusic \
            --disable-plugin=pywebview \
            --macos-app-name=Tmusic \
            --include-data-dir=src/webui/dist=webui/dist \
            --include-data-files=Logo.jpeg=Logo.jpeg \
            --include-package=pystray \
            --include-package=webview \
            --include-module=webview.platforms.cocoa \
            --include-module=platform_integration.NowPlaying \
            --include-module=objc \
            --include-module=Foundation \
            --include-module=MediaPlayer \
            --nofollow-import-to=platform_integration.MPRIS \
            --nofollow-import-to=platform_integration.SMTC \
            --macos-create-installer \
            --macos-installer-output=release/Tmusic-macOS-${{ matrix.arch }}.dmg \
            --assume-yes-for-downloads \
            --jobs=2 \
            src/main.pyw

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Tmusic-v3.0-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/Tmusic-*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release installers
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/Tmusic-*
          generate_release_notes: true