name: Build Tmusic 2.0

on:
  push:
    tags:
      - "v2.0"
      - "v2.0.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux GUI/audio tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk ffmpeg

      - name: Install macOS audio tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build application
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --onefile
          --name Tmusic
          --collect-all pygame
          --collect-all yt_dlp
          main.py

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          tar -czf release/Tmusic-Linux-x86_64.tar.gz -C dist Tmusic

      - name: Package Windows binary
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist/Tmusic.exe -DestinationPath release/Tmusic-Windows-x86_64.zip
        shell: pwsh

      - name: Package macOS application
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/Tmusic.app release/Tmusic-macOS.zip

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: Tmusic-v2.0-${{ runner.os }}-${{ runner.arch }}
          path: release/Tmusic-*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release packages
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/Tmusic-*
          generate_release_notes: true